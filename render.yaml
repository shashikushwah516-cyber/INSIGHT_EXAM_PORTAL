# ==============================================================================
# Render Infrastructure Blueprint - Insight Accessible Exam Platform
# Documentation: https://render.com/docs/blueprint-spec
# ==============================================================================

services:
  # Option 1: Unified All-in-One Service (Recommended)
  # Runs Express API and automatically serves the compiled Vite React frontend SPA.
  - type: web
    name: insight-exam-platform
    env: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm run render-build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0
      - key: MONGO_URI
        sync: false # Paste your MongoDB Atlas URI in the Render Dashboard
      - key: JWT_SECRET
        generateValue: true # Render automatically generates a secure 256-bit secret
      - key: CORS_ORIGIN
        value: "" # Optional: specify if needed or leave empty to allow all
